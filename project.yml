name: Quillmark
options:
  bundleIdPrefix: app.quillmark
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "8"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  Quillmark:
    type: application
    platform: iOS
    sources:
      - path: Quillmark
        excludes:
          - "Web/*.js"
      - path: Quillmark/Web/qm-runtime.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Quillmark
        PRODUCT_BUNDLE_IDENTIFIER: app.quillmark.ipad
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  QuillmarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuillmarkTests
    dependencies:
      - target: Quillmark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_BUNDLE_IDENTIFIER: app.quillmark.ipad.tests
schemes:
  Quillmark:
    build:
      targets:
        Quillmark: all
        QuillmarkTests: [test]
    test:
      config: Debug
      targets:
        - QuillmarkTests
