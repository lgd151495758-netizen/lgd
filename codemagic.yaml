# Codemagic CI for Quillmark (羽签).
# Builds an unsigned IPA on every push to main, runs the unit tests on an iPad simulator,
# and emails the result. Install the IPA with Sideloadly (see README).
workflows:
  quillmark-ipa:
    name: Quillmark unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build unsigned IPA
        script: |
          set -o pipefail
          xcodebuild -project Quillmark.xcodeproj -scheme Quillmark -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Quillmark.app || { tail -n 80 build.log; exit 1; }
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Quillmark.app dist/Payload/
          (cd dist && zip -qry Quillmark.ipa Payload)
          ls -la dist/Quillmark.ipa

      - name: Unit tests (iPad simulator)
        # Test failures are reported but do not withhold the IPA.
        ignore_failure: true
        script: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_ipad.py)
          echo "Simulator: $UDID"
          xcodebuild test -project Quillmark.xcodeproj -scheme Quillmark \
            -destination "id=$UDID" -derivedDataPath build-tests \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee test.log \
            | grep -E "error:|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log

    artifacts:
      - dist/Quillmark.ipa
      - build.log
      - test.log

    publishing:
      email:
        recipients:
          - lgd151495758@gmail.com
        notify:
          success: true
          failure: true
